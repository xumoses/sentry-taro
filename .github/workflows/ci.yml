name: Validate package

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          version-file: package.json
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run release:check
      - run: vp run test:release
      - run: vp check
      # Deployment is path-filtered in docs.yml; every push still checks the build.
      - run: vp run website:build
      - run: vp run typecheck
      - run: vp test run
      # prepack builds and verifies every published entry, map and Worker.
      - run: vp pm pack --pack-destination .artifacts
      - run: vp run verify:bundles
      - run: vp run verify:consumer --online
