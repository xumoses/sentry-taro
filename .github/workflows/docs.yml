name: Deploy website

on:
  push:
    branches: [main]
    # Everything the VitePress build reads; package validation stays in ci.yml.
    paths:
      - 'website/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-website
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'xumoses/sentry-taro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: https://sentry-taro.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: package.json
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run website:build
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing environment secret CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing environment variable CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      # The project was created once with `wrangler pages project create --force`
      # to stay on classic Pages (sentry-taro.pages.dev); new projects are
      # otherwise delegated to Workers static assets.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          vp exec wrangler pages deploy website/.vitepress/dist --project-name=sentry-taro --branch=main
          url="$(jq -r 'select(.type == "pages-deploy-detailed") | .url' "$WRANGLER_OUTPUT_FILE_PATH")"
          test -n "$url" || { echo '::error::Wrangler reported no deployment URL'; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Checks the immutable deployment URL; the production alias may lag briefly.
      - name: Verify deployed pages
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in / /guide/getting-started /en/ /en/guide/getting-started; do
            curl -fsS --retry 3 --retry-all-errors -o /dev/null "$DEPLOYMENT_URL$path"
          done
